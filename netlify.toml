[build]
  publish = "."
  command = "echo 'Static web application ready'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' data: blob: https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://trustvault-kw7s.onrender.com http://127.0.0.1:8000; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; frame-src 'self' blob:; object-src 'none'; base-uri 'self';"
